name = "canal-rwanda-calling-app"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./public"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "canal-calling-db"
database_id = "YOUR_D1_DATABASE_ID"  # Replace with the ID returned by `npx wrangler d1 create canal-calling-db`

